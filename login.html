<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grizzly Garage Admin Login</title><style>body{background:#090b0c;color:#f5f6f3;font:16px system-ui;display:grid;min-height:100vh;place-items:center;margin:0}.box{background:#15191a;border:1px solid #303738;padding:28px;border-radius:12px;width:min(420px,92vw)}h1{margin:0 0 6px}small{color:#aab2b2}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;box-sizing:border-box;background:#090c0d;color:white;border:1px solid #343b3c;border-radius:6px}button{margin-top:18px;background:#ff9e18;border:0;padding:12px 18px;font-weight:bold;border-radius:5px;width:100%;cursor:pointer}.flash{color:#ffbd58}</style><div class="box"><h1>Grizzly Garage</h1><small>Administrator sign-in</small>{% for msg in get_flashed_messages() %}<p class="flash">{{msg}}</p>{% endfor %}<form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Username</label><input name="username" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Sign in</button></form></div></html>
